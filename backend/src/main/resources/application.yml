server:
  port: 8080

spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

  llm:
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}