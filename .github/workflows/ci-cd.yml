name: Enterprise Portfolio CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 1. FRONTEND CI: Lint, Typecheck & Production Build
  # =========================================================
  frontend-ci:
    name: Frontend CI (React 19 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Typecheck & Vite Build
        run: npm run build

      - name: Upload Production Frontend Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =========================================================
  # 2. BACKEND CI: Maven Compile, Unit Tests & JAR Packaging
  # =========================================================
  backend-ci:
    name: Backend CI (Spring Boot 3 + Java 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile & Run Maven Unit Tests
        run: mvn clean test -B

      - name: Package Executable Spring Boot JAR
        run: mvn package -DskipTests=true -B

      - name: Upload Executable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # =========================================================
  # 3. DOCKER & CONTAINER SECURITY VERIFICATION
  # =========================================================
  docker-verify:
    name: Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Full Stack Container Images
        run: docker compose build --parallel

      - name: Verify Container Build Health
        run: |
          docker images | grep -E "portfolio|nginx|temurin" || true
          echo "✓ All container images successfully assembled."
